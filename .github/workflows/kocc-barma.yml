name: Kocc Barma Telegram bot

on:
  schedule:
    - cron: "2-59/5 * * * *"
  push:
    branches: [main]
    paths:
      - bot.py
      - test_bot.py
      - conversation-bank.json
      - corpus.json
      - .github/workflows/kocc-barma.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kocc-barma-telegram-bot
  cancel-in-progress: false

jobs:
  bot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-4o-mini
      BOT_MAX_SECONDS: "255"
      MORNING_TIME: "09:00"
      STORY_TIME: "20:30"
      POLL_TIME: "18:00"
      REPLY_EVERY: "40"
      DISCARD_BACKLOG: "false"
      AUTO_REPLY_CHANCE: "0.22"
      AUTO_REPLY_COOLDOWN_SECONDS: "1800"
      AUTO_REPLY_DAILY_MAX: "4"

    steps:
      - name: Check required secrets
        shell: bash
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "Missing TELEGRAM_BOT_TOKEN Actions secret"; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo "Missing TELEGRAM_CHAT_ID Actions secret"; exit 1; }

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test updated bot
        if: github.event_name == 'push'
        env:
          TELEGRAM_BOT_TOKEN: test
          TELEGRAM_CHAT_ID: "-10042"
        run: python -m unittest -q

      - name: Restore encrypted bot state
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: state.enc
          key: kocc-private-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: kocc-private-v1-

      - name: Import previous bot state on first upgrade
        if: steps.restore.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: kocc-state-legacy-import
          restore-keys: kocc-state-

      - name: Decrypt restored state
        if: steps.restore.outputs.cache-matched-key != ''
        run: openssl enc -d -aes-256-cbc -pbkdf2 -in state.enc -out state.json -pass env:TELEGRAM_BOT_TOKEN

      - name: Run bot
        id: poll
        shell: bash
        env:
          WINDOWS: ${{ github.event_name == 'schedule' && '3' || '1' }}
        run: |
          for ((window=1; window<=WINDOWS; window++)); do
            echo "Starting polling window ${window} of ${WINDOWS}"
            python bot.py
          done

      - name: Encrypt updated state
        id: encrypt
        if: always() && (steps.poll.outcome == 'success' || steps.poll.outcome == 'failure') && hashFiles('state.json') != ''
        run: openssl enc -aes-256-cbc -salt -pbkdf2 -in state.json -out state.enc -pass env:TELEGRAM_BOT_TOKEN

      - name: Save bot state
        if: always() && steps.encrypt.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: state.enc
          key: kocc-private-v1-${{ github.run_id }}-${{ github.run_attempt }}

