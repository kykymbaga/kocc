name: Kocc Barma Telegram bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kocc-barma-telegram-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-4o-mini
      BOT_MAX_SECONDS: "210"
      MORNING_TIME: "09:00"
      POLL_TIME: "18:00"
      REPLY_EVERY: "40"
      DISCARD_BACKLOG: "false"
      AUTO_REPLY_CHANCE: "0.22"
      AUTO_REPLY_COOLDOWN_SECONDS: "1800"
      AUTO_REPLY_DAILY_MAX: "4"

    steps:
      - name: Check required secrets
        shell: bash
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "Missing TELEGRAM_BOT_TOKEN Actions secret"; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo "Missing TELEGRAM_CHAT_ID Actions secret"; exit 1; }

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare persisted bot state
        shell: bash
        run: |
          printf '{"message_count":0,"last_morning_date":null,"last_poll_date":null,"last_quote_id":null,"offset":0,"recent_messages":[]}' > state.json

      - name: Restore bot state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: kocc-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: kocc-state-

      - name: Run bot
        run: python bot.py

      - name: Save bot state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: kocc-state-${{ github.run_id }}-${{ github.run_attempt }}

